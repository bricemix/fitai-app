name: smartfit
description: "DietVision - Coach nutrition & fitness alimenté par l'IA"
publish_to: 'none'

version: 1.0.0+34

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  http: ^1.2.2
  image_picker: ^1.1.2
  image: ^4.2.0
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  # ── Social auth ────────────────────────────────────────────────
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1
  sign_in_with_apple: ^6.1.4
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/dietvision-icon.png"
  adaptive_icon_background: "#0d0d1a"
  adaptive_icon_foreground: "assets/logo/dietvision-icon-fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/
